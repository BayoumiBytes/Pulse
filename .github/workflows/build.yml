name: Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sdkmanager "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build standalone debug APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug --no-daemon --stacktrace

      - name: Upload standalone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-standalone-debug
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
